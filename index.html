<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176345"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mis Finanzas"><title>Mis Finanzas · Personal</title><style>
:root{--green:#176345;--dark:#123d2d;--mint:#e5f4ec;--bg:#f5f7f5;--text:#172821;--muted:#718078;--line:#e5ebe7;--red:#c64a4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:95px}.top{background:var(--green);color:white;padding:calc(20px + env(safe-area-inset-top)) 20px 26px;border-radius:0 0 28px 28px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;letter-spacing:-.7px}.brand small{font-size:11px;display:block;opacity:.78;font-weight:500;letter-spacing:1.6px}.iconbtn{border:1px solid #ffffff44;background:#ffffff20;color:inherit;border-radius:13px;padding:9px 12px}.balanceLabel{margin-top:27px;opacity:.8;font-size:13px}.balance{font-size:37px;font-weight:800;letter-spacing:-1px;margin:4px 0 16px}.topstats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.topstat{background:#ffffff1c;border:1px solid #ffffff20;padding:13px;border-radius:16px}.topstat span{display:block;opacity:.8;font-size:12px}.topstat strong{font-size:18px;display:block;margin-top:5px}.main{padding:18px 16px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:9px 2px 13px}.sectionhead h2{font-size:19px;margin:0}.sectionhead button,.link{background:none;border:0;color:var(--green);font-weight:700}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:15px;box-shadow:0 3px 14px #0d33240a}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid var(--line);border-radius:16px;background:white;padding:15px 5px;font-weight:700;color:var(--dark)}.quick b{display:block;font-size:22px;margin-bottom:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:12px}.amount{font-weight:800}.expense{color:var(--red)}.income{color:var(--green)}.tx{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}.bubble{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--mint);font-size:20px;flex-shrink:0}.txinfo{flex:1;min-width:0}.txinfo strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txinfo small{color:var(--muted)}.txamount{text-align:right}.txamount small{display:block;color:var(--muted);margin-top:3px}.bar{height:9px;background:#e9eee9;border-radius:20px;overflow:hidden;margin:10px 0}.bar>div{height:100%;background:var(--green);border-radius:20px}.pill{border-radius:30px;background:var(--mint);color:var(--green);padding:6px 9px;font-size:11px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:5}.nav button{border:0;background:transparent;color:#8b9991;font-size:10px;display:grid;gap:4px;justify-items:center}.nav button b{font-size:22px}.nav button.active{color:var(--green);font-weight:800}.fab{position:fixed;bottom:calc(83px + env(safe-area-inset-bottom));right:max(18px,calc((100vw - 530px)/2));border:0;background:var(--green);color:white;border-radius:50%;width:56px;height:56px;font-size:30px;box-shadow:0 7px 22px #17634555;z-index:4}.hidden{display:none!important}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#53685b;font-weight:700}.field input,.field select{width:100%;padding:13px;border:1px solid #dce6df;border-radius:12px;background:#fff;color:var(--text);outline-color:var(--green)}.btn{border:0;background:var(--green);color:white;padding:14px 18px;border-radius:13px;font-weight:800}.btn.secondary{background:var(--mint);color:var(--green)}.btn.danger{background:#fdeaea;color:#a43232}.full{width:100%}.modal{position:fixed;inset:0;background:#06190e91;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(100%,560px);border-radius:25px 25px 0 0;padding:21px 20px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:1px solid var(--line);background:#f5f8f6;border-radius:12px;padding:11px;font-weight:700}.seg button.sel{background:var(--green);color:#fff}.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 14px}.filters button{border:1px solid var(--line);background:white;border-radius:20px;padding:8px 12px;white-space:nowrap}.filters button.sel{background:var(--green);color:white}.empty{text-align:center;padding:24px 9px;color:var(--muted)}.month{border:0;background:#ffffff24;color:white;border-radius:10px;padding:7px}.progressline{display:flex;justify-content:space-between;gap:8px}.minihead{margin:0 0 8px}.note{background:#f1f7f2;padding:13px;border-radius:13px;font-size:12px;line-height:1.5;color:#456151}.space{height:8px}.dangertext{color:var(--red)}
</style></head><body><div class="app"><header class="top"><div class="topline"><div class="brand">◈ Mis Finanzas <small>CONTROL PERSONAL</small></div><button class="iconbtn" id="settingsTop">⚙ Ajustes</button></div><div class="balanceLabel">Balance del mes <select id="month" class="month" aria-label="Mes"></select></div><div class="balance" id="balance">$0.00</div><div class="topstats"><div class="topstat"><span>↗ Ingresos</span><strong id="income">$0.00</strong></div><div class="topstat"><span>↘ Gastos</span><strong id="expenses">$0.00</strong></div></div></header><main class="main" id="content"></main><button class="fab" id="add" aria-label="Agregar movimiento">+</button><nav class="nav" id="nav"><button data-tab="inicio" class="active"><b>⌂</b>Inicio</button><button data-tab="movimientos"><b>☷</b>Movimientos</button><button data-tab="presupuestos"><b>◉</b>Presupuesto</button><button data-tab="deudas"><b>▤</b>Deudas</button><button data-tab="ajustes"><b>⚙</b>Ajustes</button></nav></div><div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div><script>
(()=>{'use strict';const KEY='mi_finanzas_v1';const categories={Gasto:['Alimentación','Casa y renta','Transporte','Salud','Hijos y familia','Tarjetas y créditos','Compras','Servicios','Entretenimiento','Otros'],Ingreso:['Sueldo','Ingreso extra','Reembolso','Otros']};const icons={'Alimentación':'🍽️','Casa y renta':'🏠','Transporte':'🚗','Salud':'💊','Hijos y familia':'👨‍👩‍👧‍👦','Tarjetas y créditos':'💳','Compras':'🛍️','Servicios':'📱','Entretenimiento':'🎬','Otros':'📦','Sueldo':'💼','Ingreso extra':'✨','Reembolso':'↩️'};const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}}db.transactions=Array.isArray(db.transactions)?db.transactions:[];db.budgets=db.budgets||{};db.debts=Array.isArray(db.debts)?db.debts:[];let tab='inicio',filter='Todos',selectedMonth=today().slice(0,7),editId=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('No se pudo guardar. Revisa el almacenamiento de Safari.')}};const txMonth=()=>db.transactions.filter(t=>t.date.slice(0,7)===selectedMonth);const sum=(arr,type)=>arr.filter(t=>t.type===type).reduce((a,t)=>a+Number(t.amount),0);function months(){let arr=[];for(let i=-12;i<=12;i++){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i);let val=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');arr.push(`<option value="${val}" ${selectedMonth===val?'selected':''}>${d.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</option>`)}$('month').innerHTML=arr.join('')}function render(){months();let tx=txMonth(),inc=sum(tx,'Ingreso'),exp=sum(tx,'Gasto');$('income').textContent=money(inc);$('expenses').textContent=money(exp);$('balance').textContent=money(inc-exp);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('add').classList.toggle('hidden',tab==='ajustes');let c=$('content');if(tab==='inicio'){let catTotals={};tx.filter(t=>t.type==='Gasto').forEach(t=>catTotals[t.category]=(catTotals[t.category]||0)+Number(t.amount));let sorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);c.innerHTML=`<div class="quick"><button data-action="new-expense"><b>↘</b>Gasto</button><button data-action="new-income"><b>↗</b>Ingreso</button><button data-action="new-debt"><b>💳</b>Deuda</button></div><div class="sectionhead"><h2>Gastos por categoría</h2></div><div class="card">${sorted.length?sorted.slice(0,5).map(([cat,val])=>`<div style="margin-bottom:15px"><div class="progressline"><span>${icons[cat]||'📦'} ${esc(cat)}</span><strong>${money(val)}</strong></div><div class="bar"><div style="width:${Math.min(100,exp?val/exp*100:0)}%"></div></div></div>`).join(''):'<div class="empty">Registra tu primer gasto para ver tus categorías.</div>'}</div><div class="sectionhead"><h2>Movimientos recientes</h2><button data-action="see-all">Ver todos</button></div><div class="card">${txRows(tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div><div class="note">🔒 Tus datos se guardan en este navegador. No se conectan a tus bancos ni se envían a servidores. Haz respaldos desde Ajustes.</div>`}else if(tab==='movimientos'){let list=tx.filter(t=>filter==='Todos'||t.type===filter).sort((a,b)=>b.date.localeCompare(a.date));c.innerHTML=`<div class="sectionhead"><h2>Movimientos</h2><span class="pill">${list.length} registros</span></div><div class="filters">${['Todos','Gasto','Ingreso'].map(x=>`<button data-filter="${x}" class="${filter===x?'sel':''}">${x==='Todos'?'Todos':x==='Gasto'?'Gastos':'Ingresos'}</button>`).join('')}</div><div class="card">${txRows(list)}</div>`}else if(tab==='presupuestos'){let b=db.budgets[selectedMonth]||{};c.innerHTML=`<div class="sectionhead"><h2>Presupuestos mensuales</h2></div><div class="note">Define cuánto quieres gastar en cada categoría. Se calcula automáticamente con tus movimientos del mes seleccionado.</div><div class="space"></div>${categories.Gasto.map(cat=>{let spent=tx.filter(t=>t.type==='Gasto'&&t.category===cat).reduce((a,t)=>a+Number(t.amount),0),limit=Number(b[cat]||0),pct=limit?spent/limit*100:0;return `<div class="card"><div class="progressline"><strong>${icons[cat]} ${cat}</strong><button class="link" data-budget="${esc(cat)}">${limit?'Editar':'Asignar'}</button></div><p class="muted">${money(spent)} gastados ${limit?'de '+money(limit):'· sin límite'}</p><div class="bar"><div style="width:${Math.min(100,pct)}%;background:${pct>100?'#c64a4a':'var(--green)'}"></div></div>${limit?`<small class="${pct>100?'dangertext':'muted'}">${pct>100?'Excedido por '+money(spent-limit):'Disponible: '+money(limit-spent)}</small>`:''}</div>`}).join('')}`}else if(tab==='deudas'){let outstanding=db.debts.reduce((a,d)=>a+Number(d.balance),0);c.innerHTML=`<div class="sectionhead"><h2>Mis deudas</h2><button data-action="new-debt">+ Agregar</button></div><div class="card"><div class="muted">Saldo pendiente registrado</div><div style="font-size:28px;font-weight:800;margin-top:6px">${money(outstanding)}</div></div>${db.debts.length?db.debts.map(d=>`<div class="card"><div class="row"><strong>💳 ${esc(d.name)}</strong><span class="pill">${esc(d.due||'Sin fecha')}</span></div><div style="font-size:24px;font-weight:800;margin:12px 0">${money(d.balance)}</div><div class="muted">Pago esperado: ${money(d.payment)}</div><div style="display:flex;gap:8px;margin-top:15px"><button class="btn secondary" data-pay="${esc(d.id)}">Registrar abono</button><button class="btn danger" data-remove-debt="${esc(d.id)}">Eliminar</button></div></div>`).join(''):'<div class="card empty">Agrega tus tarjetas o préstamos para controlar sus saldos y vencimientos.</div>'}<div class="note">Los abonos reducen el saldo de la deuda y crean un gasto en tus movimientos. No se realizan pagos bancarios.</div>`}else{c.innerHTML=`<div class="sectionhead"><h2>Configuración y respaldo</h2></div><div class="card"><h3 class="minihead">Tus datos son privados</h3><p class="muted">Toda la información se guarda únicamente en el almacenamiento local de este navegador. Si borras los datos de Safari, podrías perderla.</p><button class="btn full" data-action="export">⬇ Descargar respaldo JSON</button><div class="space"></div><label class="btn secondary full" style="display:block;text-align:center;cursor:pointer">⬆ Restaurar respaldo<input type="file" id="import" accept="application/json,.json" hidden></label></div><div class="card"><h3 class="minihead">Moneda</h3><p>Pesos mexicanos (MXN)</p><button class="btn danger full" data-action="reset">Borrar todos mis datos</button></div><div class="note">Versión 1.0 · Uso personal · Sin cuentas bancarias conectadas · Sin suscripciones.</div>`}}function txRows(list){return list.length?list.map(t=>`<div class="tx"><div class="bubble">${icons[t.category]||'💰'}</div><div class="txinfo"><strong>${esc(t.description)}</strong><small>${esc(t.category)} · ${esc(t.date)}</small></div><div class="txamount"><div class="amount ${t.type==='Ingreso'?'income':'expense'}">${t.type==='Ingreso'?'+':'−'}${money(t.amount)}</div><button class="link" data-edit="${esc(t.id)}" style="font-size:11px">Editar</button></div></div>`).join(''):'<div class="empty">No hay movimientos para mostrar.</div>'}function show(html){$('sheet').innerHTML=html;$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden');editId=null}function transaction(type='Gasto',id=null){editId=id;let t=id?db.transactions.find(x=>x.id===id):null;type=t?.type||type;show(`<div class="row"><h2>${t?'Editar':'Nuevo'} movimiento</h2><button class="iconbtn" style="color:var(--dark)" data-action="close">✕</button></div><div class="seg"><button data-type="Gasto" class="${type==='Gasto'?'sel':''}">↘ Gasto</button><button data-type="Ingreso" class="${type==='Ingreso'?'sel':''}">↗ Ingreso</button></div><form id="txform"><input type="hidden" name="type" value="${type}"><div class="field"><label>Monto (MXN)</label><input name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal" placeholder="0.00" value="${t?.amount??''}"></div><div class="field"><label>Concepto</label><input name="description" maxlength="90" required placeholder="Ej. Supermercado" value="${esc(t?.description||'')}"></div><div class="field"><label>Categoría</label><select name="category">${categories[type].map(cat=>`<option ${t?.category===cat?'selected':''}>${cat}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input type="date" name="date" required value="${t?.date||today()}"></div><button class="btn full" type="submit">Guardar movimiento</button>${t?'<div class="space"></div><button class="btn danger full" type="button" data-action="delete-tx">Eliminar movimiento</button>':''}</form>`)}function budget(cat){let current=(db.budgets[selectedMonth]||{})[cat]||'';show(`<div class="row"><h2>Presupuesto</h2><button data-action="close" class="iconbtn" style="color:var(--dark)">✕</button></div><p>${esc(cat)} · ${selectedMonth}</p><form id="budgetform" data-category="${esc(cat)}"><div class="field"><label>Límite mensual (MXN)</label><input name="amount" type="number" min="0" step="0.01" inputmode="decimal" value="${current}" required></div><button class="btn full">Guardar presupuesto</button></form>`)}function debt(){show(`<div class="row"><h2>Agregar deuda</h2><button data-action="close" class="iconbtn" style="color:var(--dark)">✕</button></div><form id="debtform"><div class="field"><label>Tarjeta o préstamo</label><input name="name" maxlength="70" placeholder="Ej. Tarjeta de crédito" required></div><div class="field"><label>Saldo pendiente (MXN)</label><input name="balance" type="number" min="0" step="0.01" required inputmode="decimal"></div><div class="field"><label>Pago esperado (MXN)</label><input name="payment" type="number" min="0" step="0.01" value="0" required inputmode="decimal"></div><div class="field"><label>Próxima fecha límite (opcional)</label><input name="due" type="date"></div><button class="btn full">Guardar deuda</button></form>`)}function pay(id){let d=db.debts.find(x=>x.id===id);if(!d)return;show(`<div class="row"><h2>Registrar abono</h2><button data-action="close" class="iconbtn" style="color:var(--dark)">✕</button></div><p>${esc(d.name)} · saldo ${money(d.balance)}</p><form id="payform" data-id="${esc(id)}"><div class="field"><label>Importe del abono</label><input type="number" name="amount" min="0.01" max="${d.balance}" step="0.01" value="${Math.min(d.payment||0,d.balance)||''}" required inputmode="decimal"></div><div class="field"><label>Fecha</label><input type="date" name="date" value="${today()}" required></div><button class="btn full">Registrar abono</button></form>`)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}$('month').addEventListener('change',e=>{selectedMonth=e.target.value;render()});$('settingsTop').onclick=()=>{tab='ajustes';render()};$('add').onclick=()=>transaction();$('nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-filter],[data-edit],[data-budget],[data-pay],[data-remove-debt],[data-type]');if(!el)return;if(el.dataset.filter){filter=el.dataset.filter;render()}if(el.dataset.edit)transaction('Gasto',el.dataset.edit);if(el.dataset.budget)budget(el.dataset.budget);if(el.dataset.pay)pay(el.dataset.pay);if(el.dataset.removeDebt){if(confirm('¿Eliminar esta deuda? Los movimientos anteriores no se borrarán.')){db.debts=db.debts.filter(d=>d.id!==el.dataset.removeDebt);save();render()}}if(el.dataset.type){let form=$('txform');if(form){let old={amount:form.elements.namedItem('amount').value,description:form.elements.namedItem('description').value,date:form.elements.namedItem('date').value};transaction(el.dataset.type,editId);let f=$('txform');f.elements.amount.value=old.amount;f.elements.description.value=old.description;f.elements.date.value=old.date}}switch(el.dataset.action){case 'new-expense':transaction('Gasto');break;case 'new-income':transaction('Ingreso');break;case 'new-debt':debt();break;case 'see-all':tab='movimientos';render();break;case 'close':close();break;case 'delete-tx':if(confirm('¿Eliminar este movimiento?')){db.transactions=db.transactions.filter(t=>t.id!==editId);save();close();render()}break;case 'export':{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='respaldo_mis_finanzas_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'reset':if(confirm('Esto eliminará todos los movimientos, presupuestos y deudas de este navegador. ¿Continuar?')&&confirm('Última confirmación: ¿borrar todo?')){db={transactions:[],budgets:{},debts:[]};save();render()}break}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='txform'){let amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0)return alert('Ingresa un monto válido');let obj={id:editId||uid(),type:v.type,amount,description:v.description.trim(),category:v.category,date:v.date};if(!obj.description||!/^\d{4}-\d{2}-\d{2}$/.test(obj.date))return;db.transactions=editId?db.transactions.map(t=>t.id===editId?obj:t):[...db.transactions,obj];selectedMonth=v.date.slice(0,7)}if(f.id==='budgetform'){let amount=Number(v.amount);if(!Number.isFinite(amount)||amount<0)return;db.budgets[selectedMonth]??={};db.budgets[selectedMonth][f.dataset.category]=amount}if(f.id==='debtform'){let balance=Number(v.balance),payment=Number(v.payment);if(balance<0||payment<0||!Number.isFinite(balance)||!Number.isFinite(payment))return;db.debts.push({id:uid(),name:v.name.trim(),balance,payment,due:v.due})}if(f.id==='payform'){let d=db.debts.find(x=>x.id===f.dataset.id),amount=Number(v.amount);if(!d||amount<=0||amount>d.balance)return alert('El abono supera el saldo pendiente');d.balance=Math.round((d.balance-amount)*100)/100;db.transactions.push({id:uid(),type:'Gasto',amount,description:'Abono: '+d.name,category:'Tarjetas y créditos',date:v.date});selectedMonth=v.date.slice(0,7)}save();close();render()});document.addEventListener('change',async e=>{if(e.target.id!=='import')return;let file=e.target.files?.[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.transactions)||!Array.isArray(parsed.debts)||typeof parsed.budgets!=='object'||!parsed.budgets)throw Error();if(!confirm('¿Reemplazar los datos actuales con este respaldo?'))return;db={transactions:parsed.transactions,budgets:parsed.budgets,debts:parsed.debts};save();render();alert('Respaldo restaurado')}catch{alert('El archivo no es un respaldo válido')}});render()})();
</script></body></html>
